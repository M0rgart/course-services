$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/assignments/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/problem+json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: 411cf55d-85c7-5f95-e284-d89ba4e998da
  body:
    type: json
    content: |-
      {
        "title": "stringstring",
        "description": "string",
        "submit_limit": 9,
        "date_start": "1982-11-27",
        "date_end": "2008-10-22",
        "materials_url": "https://qHYPwPQclVLEACYEiCZ.gboDYjtH0j+WSeuQBtnrhsHk1c+0sALWde"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "TOKEN_MISSING",
          "message": "Токен отсутствует",
          "status": 401,
          "path": "/api/v1/courses",
          "request_id": "00000000-0000-0000-0000-000000000000"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string",
                "example": "COURSE_NOT_FOUND"
              },
              "message": {
                "type": "string",
                "example": "Курс не существует"
              },
              "status": {
                "type": "integer",
                "example": 404
              },
              "path": {
                "type": "string",
                "example": "/api/v1/courses/"
              },
              "request_id": {
                "type": "string",
                "format": "uuid"
              }
            },
            "required": [
              "code",
              "message",
              "status",
              "path",
              "request_id"
            ]
          }
        },
        "required": [
          "error"
        ]
      }
order: 2000
